name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # npm install (not the strict `npm ci`) so the Linux runner resolves
        # its own platform-specific native binaries (Tailwind oxide / SWC),
        # which a Windows-generated lockfile doesn't include.
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The exported static site:
          local-dir: ./out/
          # FTP account should be rooted at the site's document root
          # (public_html or the domain folder). Then "./" deploys there.
          server-dir: ./
          # Switch to "ftps" if your host supports/ requires it.
          protocol: ftp
