name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # npm install (not the strict `npm ci`) so the Linux runner resolves
        # its own platform-specific native binaries (Tailwind oxide / SWC),
        # which a Windows-generated lockfile doesn't include.
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to cPanel via rsync over SSH
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER_NAME: ${{ secrets.SSH_USERNAME }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          REMOTE: ${{ secrets.SSH_REMOTE_PATH }}
        run: |
          rsync -avz --delete \
            --exclude 'cgi-bin/' \
            --exclude '.well-known/' \
            -e "ssh -p $PORT -o StrictHostKeyChecking=accept-new" \
            out/ "$USER_NAME@$HOST:$REMOTE/"
